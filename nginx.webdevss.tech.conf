# ==============================================================================
# Nginx Configuration for https://webdevss.tech
# Place at: /etc/nginx/sites-available/webdevss.tech
# Enable with: sudo ln -s /etc/nginx/sites-available/webdevss.tech /etc/nginx/sites-enabled/
# ==============================================================================

# 1. HTTP Configuration (Port 80) - Handles Let's Encrypt challenge & redirects to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name webdevss.tech www.webdevss.tech;

    # Maximum file upload size (projects, avatar, attachments)
    client_max_body_size 25M;

    # Location for Let's Encrypt renewal validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy to local Next.js instance on port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
